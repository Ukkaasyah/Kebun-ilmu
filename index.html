<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kebun Ilmu</title>
<meta name="theme-color" content="#1B2154">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kebun Ilmu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/Amiri-Regular.ttf" as="font" type="font/ttf" crossorigin>

@font-face{font-family:'Amiri';src:url('fonts/Amiri-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}</style>
<style>

/* Arah desain: papan main malam-biru dengan kartu modul berwarna tegas; rapi, berani, tidak kekanak-kanakan berlebihan. */
:root {
  --ink: #1B2154;
  --ink-2: #545B8C;
  --bg: #EDF0FA;
  --card: #FFFFFF;
  --line: #DCE1F2;
  --sun: #FFB81F;
  --coral: #FF6150;
  --sky: #2B7BEF;
  --violet: #6F55F2;
  --pink: #EC4B8C;
  --orange: #FF8A2A;
  --navy: #2C347A;
  --ok: #2B7BEF;
  --ok-bg: #E4EEFF;
  --no: #FF6150;
  --no-bg: #FFE9E6;
  --display: 'Baloo 2', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --arab: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(rgba(27,33,84,.06) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.ar { font-family: var(--arab); direction: rtl; unicode-bidi: isolate; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }

/* ---------- Top / home ---------- */
.top {
  position: relative; overflow: hidden; color: #fff;
  background: var(--ink); border-radius: 0 0 30px 30px;
  padding: calc(18px + env(safe-area-inset-top)) 20px 22px;
}
.top::before, .top::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
.top::before { width: 190px; height: 190px; right: -60px; top: -70px; background: var(--sun); opacity: .95; }
.top::after { width: 90px; height: 90px; right: 92px; top: 58px; background: var(--coral); opacity: .9; }
.top > * { position: relative; z-index: 1; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .2px; display: flex; align-items: baseline; gap: 8px; }
.brand-name .ar { font-size: 18px; font-weight: 700; opacity: .8; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.14); display: grid; place-items: center; font-size: 20px; }
.hello { margin-top: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hello small { display: block; font-weight: 700; opacity: .75; font-size: 14px; }
.hello .who { font-family: var(--display); font-weight: 800; font-size: 30px; display: flex; align-items: center; gap: 8px; text-align: left; }
.hello .who span.chev { font-size: 16px; opacity: .6; }
.cups { background: #fff; color: var(--ink); border-radius: 18px; padding: 8px 14px; font-family: var(--display); font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 0 rgba(0,0,0,.18); font-variant-numeric: tabular-nums; }

.section { padding: 18px 16px 0; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; }
.section-h h2 { font-size: 20px; }
.section-h small { color: var(--ink-2); font-weight: 700; }

.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: var(--card); padding: 6px; border-radius: 20px; border: 1px solid var(--line); }
.lv { border-radius: 15px; padding: 8px 2px 7px; text-align: center; color: var(--ink-2); }
.lv b { display: block; font-family: var(--display); font-size: 22px; line-height: 1; color: var(--ink); }
.lv span { font-size: 10.5px; font-weight: 800; line-height: 1.15; display: block; margin-top: 3px; }
.lv[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #0d1238; }
.lv[aria-pressed="true"] b { color: var(--sun); }
.lv:disabled { opacity: .45; cursor: not-allowed; }
.lv-note { margin: 8px 6px 0; font-size: 13.5px; color: var(--ink-2); font-weight: 700; }

.mods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mod {
  position: relative; overflow: hidden; text-align: left; color: #fff;
  border-radius: 24px; padding: 14px 14px 13px; min-height: 152px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  background: var(--c); box-shadow: 0 5px 0 var(--cd);
  transition: transform .12s ease;
}
.mod:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--cd); }
.mod::after { content: ''; position: absolute; width: 120px; height: 120px; border-radius: 50%; right: -42px; bottom: -48px; background: rgba(255,255,255,.13); }
.mod.wide { grid-column: 1 / -1; min-height: 120px; flex-direction: row; align-items: center; }
.glyph { width: 54px; height: 54px; border-radius: 17px; background: rgba(255,255,255,.2); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; flex: none; }
.glyph.ar { font-family: var(--arab); font-size: 26px; font-weight: 700; padding-top: 4px; }
.dots4 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.dots4 i { width: 14px; height: 14px; border-radius: 50%; display: block; border: 2px solid rgba(255,255,255,.9); }
.mod h3 { font-size: 20px; }
.mod .sub { font-family: var(--arab); font-size: 17px; opacity: .9; direction: rtl; text-align: left; margin-top: 1px; }
.mod .meta { font-size: 12.5px; font-weight: 800; opacity: .9; margin-top: 4px; }
.mod.dark { color: var(--ink); }
.mod.dark .glyph { background: rgba(27,33,84,.12); }
.mod.dark::after { background: rgba(255,255,255,.25); }

/* ---------- Module page ---------- */
.band { color: #fff; background: var(--c); border-radius: 0 0 30px 30px; padding: calc(14px + env(safe-area-inset-top)) 16px 18px; position: relative; overflow: hidden; }
.band.dark { color: var(--ink); }
.band::after { content: ''; position: absolute; width: 170px; height: 170px; border-radius: 50%; right: -50px; top: -60px; background: rgba(255,255,255,.16); }
.band > * { position: relative; z-index: 1; }
.band-row { display: flex; align-items: center; gap: 12px; }
.back { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.22); font-size: 22px; display: grid; place-items: center; font-weight: 900; }
.band h1 { font-size: 28px; }
.band .ar { font-size: 20px; opacity: .9; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: rgba(255,255,255,.22); font-weight: 800; font-size: 13px; margin-top: 10px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 5px; margin: 16px 16px 0; }
.tabs.three { grid-template-columns: repeat(3, 1fr); margin: 0 0 12px; }
.tab { padding: 10px; border-radius: 13px; font-weight: 900; color: var(--ink-2); font-size: 15px; }
.tab[aria-selected="true"] { background: var(--ink); color: #fff; }
.tabs.three .tab { font-size: 13px; padding: 9px 4px; }

/* challenge path */
.path { position: relative; padding: 18px 16px 6px; display: flex; flex-direction: column; gap: 4px; }
.node-row { display: flex; }
.node-row:nth-child(odd) { justify-content: flex-start; padding-left: 14%; }
.node-row:nth-child(even) { justify-content: flex-end; padding-right: 14%; }
.node { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 128px; }
.node .disc {
  width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: #fff; font-family: var(--display); font-weight: 800; font-size: 32px;
  box-shadow: 0 6px 0 var(--cd), inset 0 -6px 0 rgba(0,0,0,.08);
}
.node.done .disc { background: var(--sun); color: var(--ink); box-shadow: 0 6px 0 #C98A00; }
.node.lock .disc { background: #CBD1E6; box-shadow: 0 6px 0 #A9B0CB; color: #fff; font-size: 26px; }
.node .lbl { font-weight: 900; font-size: 14px; }
.node .st { font-size: 15px; letter-spacing: 1px; color: #C9CFE3; }
.node .st b { color: var(--sun); font-weight: 400; }
.node:not(.lock):active .disc { transform: translateY(4px); box-shadow: 0 2px 0 var(--cd); }

/* learn cards */
.learn { padding: 16px; display: grid; gap: 12px; }
.lcard { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
.lcard h3 { font-size: 19px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.lcard h3 .ar { font-size: 20px; color: var(--ink-2); font-weight: 700; }
.lcard p { margin: 8px 0 0; color: #343B6E; }
.ex { display: grid; gap: 8px; margin-top: 12px; }
.ex-row { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 14px; padding: 8px 12px; }
.ex-row .ar { font-size: 26px; min-width: 96px; text-align: center; line-height: 1.5; }
.ex-row span { font-size: 14px; font-weight: 700; color: #343B6E; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.wcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; text-align: center; display: grid; gap: 2px; }
.wcard .em { font-size: 34px; line-height: 1.2; }
.wcard .ar { font-size: 28px; line-height: 1.5; }
.wcard .lt { font-size: 13px; color: var(--ink-2); font-weight: 700; font-style: italic; }
.wcard .id { font-weight: 800; }
.alpha { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.alpha button { aspect-ratio: 1; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 26px; box-shadow: 0 3px 0 var(--line); }
.alpha button small { display: block; font-size: 14px; color: var(--ink-2); margin-top: -8px; }
.swgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.sw { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px; text-align: center; }
.sw i { display: block; height: 52px; border-radius: 12px; border: 1px solid rgba(0,0,0,.12); margin-bottom: 6px; }
.sw b { display: block; font-size: 14px; }
.sw .ar { font-size: 20px; display: block; }
.times { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.times button { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 900; }
.times button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.ttable { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.ttable div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.doa { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; }
.doa-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.doa-h b { font-family: var(--display); font-size: 18px; }
.doa-h .kali { background: var(--ink); color: var(--sun); border-radius: 99px; padding: 2px 10px; font-weight: 900; font-size: 13px; white-space: nowrap; }
.doa .ar { font-size: 27px; line-height: 1.9; margin: 10px 0 6px; text-align: right; }
.doa p { margin: 0; color: #343B6E; font-size: 14.5px; }
.say { width: 38px; height: 38px; border-radius: 12px; background: var(--bg); font-size: 18px; flex: none; }

/* ---------- Play ---------- */
.play { min-height: 100%; display: flex; flex-direction: column; padding: calc(12px + env(safe-area-inset-top)) 16px 20px; gap: 14px; }
.playbar { display: flex; align-items: center; gap: 10px; }
.x { width: 40px; height: 40px; border-radius: 13px; background: var(--card); border: 1px solid var(--line); font-weight: 900; font-size: 18px; flex: none; }
.prog { flex: 1; display: flex; gap: 4px; }
.prog i { flex: 1; height: 12px; border-radius: 99px; background: #D5DBEE; }
.prog i.ok { background: var(--sky); }
.prog i.no { background: var(--coral); }
.prog i.now { background: var(--ink); }
.pcups { font-family: var(--display); font-weight: 800; font-size: 19px; display: flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.qcard { background: var(--card); border-radius: 28px; border: 1px solid var(--line); padding: 20px 16px 22px; text-align: center; box-shadow: 0 6px 0 var(--line); position: relative; }
.qlabel { font-weight: 900; color: var(--ink-2); font-size: 15px; letter-spacing: .2px; }
.qtext { font-family: var(--display); font-weight: 700; font-size: 23px; margin-top: 6px; text-wrap: balance; line-height: 1.25; }
.qemoji { font-size: 76px; line-height: 1.15; margin-top: 4px; }
.qemoji.row { font-size: 40px; letter-spacing: 2px; line-height: 1.35; word-break: break-word; }
.qar { font-family: var(--arab); direction: rtl; font-size: 40px; line-height: 1.75; margin-top: 4px; }
.qar.long { font-size: 28px; line-height: 1.95; }
.qar mark { background: #FFE6A3; color: inherit; border-radius: 8px; padding: 0 6px; }
.qsub { color: var(--ink-2); font-weight: 800; font-style: italic; }
.qbig { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.blank { display: inline-block; min-width: 64px; border-bottom: 4px dashed var(--sky); color: var(--sky); margin: 0 4px; line-height: 1; }
.swatch-big { width: 120px; height: 120px; border-radius: 30px; margin: 10px auto 0; border: 1px solid rgba(0,0,0,.15); box-shadow: inset 0 -8px 0 rgba(0,0,0,.08); }
.mix { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; font-family: var(--display); font-weight: 800; font-size: 34px; }
.mix i { width: 74px; height: 74px; border-radius: 22px; display: block; border: 1px solid rgba(0,0,0,.15); }
.speak { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 14px; background: var(--ok-bg); font-size: 20px; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answers.one { grid-template-columns: 1fr; }
.opt {
  background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 14px 10px; min-height: 66px;
  font-weight: 900; font-size: 18px; box-shadow: 0 4px 0 var(--line); line-height: 1.25;
  transition: transform .08s ease;
}
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.ar { font-family: var(--arab); font-weight: 700; font-size: 27px; padding: 8px 10px; line-height: 1.7; }
.opt.ar.long { font-size: 21px; }
.opt .osub { display: block; font-family: var(--body); font-size: 13px; color: var(--ink-2); font-style: italic; direction: ltr; font-weight: 700; }
.opt.emo { font-size: 46px; padding: 10px; }
.opt.big { font-family: var(--display); font-size: 30px; font-weight: 800; }
.opt.letter { font-family: var(--display); font-size: 38px; font-weight: 800; }
.opt.swatch { min-height: 92px; border-width: 3px; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 4px 0 var(--ok); }
.opt.wrong { border-color: var(--no); background: var(--no-bg); box-shadow: 0 4px 0 var(--no); animation: shake .35s; }
.opt.swatch.right { box-shadow: 0 0 0 4px var(--ok-bg), 0 4px 0 var(--ok); }
.opt.swatch.wrong { box-shadow: 0 0 0 4px var(--no-bg), 0 4px 0 var(--no); }
.opt:disabled { cursor: default; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfb { border-radius: 24px; padding: 18px 10px; font-family: var(--display); font-weight: 800; font-size: 24px; color: #fff; display: grid; gap: 2px; justify-items: center; }
.tfb span { font-size: 38px; line-height: 1; }
.tfb.yes { background: var(--sky); box-shadow: 0 6px 0 #1757B5; }
.tfb.nope { background: var(--coral); box-shadow: 0 6px 0 #C93A2C; }
.tfb:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
.tfb.dim { opacity: .35; }

.boxes { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.box { width: 46px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 30px; background: var(--bg); border: 2px solid var(--line); }
.box.blank-b { background: #fff; border: 3px dashed var(--sky); color: var(--sky); }
.box.filled { border-style: solid; background: var(--ok-bg); }
.box.okb { background: var(--ok-bg); border: 3px solid var(--ok); color: var(--ink); }
.box.nob { background: var(--no-bg); border: 3px solid var(--no); color: var(--ink); }
.pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.tile { width: 58px; height: 62px; border-radius: 18px; background: var(--card); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-family: var(--display); font-weight: 800; font-size: 30px; }
.tile:disabled { opacity: .25; box-shadow: none; transform: translateY(4px); }
.undo { margin: 4px auto 0; display: block; font-weight: 900; color: var(--ink-2); padding: 8px 14px; }
.box-small .box { width: 38px; height: 48px; font-size: 25px; }

/* feedback sheet */
#sheet { position: fixed; inset: 0; pointer-events: none; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sheet.on { pointer-events: auto; background: rgba(27,33,84,.28); }
.fb { width: 100%; max-width: 560px; border-radius: 30px 30px 0 0; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); text-align: center; animation: up .22s ease-out; }
.fb.ok { background: #fff; border-top: 6px solid var(--sky); }
.fb.no { background: #fff; border-top: 6px solid var(--coral); }
.fb-icons { display: flex; justify-content: center; gap: 14px; font-size: 64px; line-height: 1; height: 72px; }
.fb-icons span { display: inline-block; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.fb-icons span + span { animation-delay: .1s; }
.fb-t { font-family: var(--display); font-weight: 800; font-size: 28px; margin-top: 8px; }
.fb.ok .fb-t { color: var(--sky); }
.fb.no .fb-t { color: var(--coral); }
.fb-s { font-weight: 800; color: var(--ink-2); margin-top: 2px; }
.fb-ans { margin: 10px auto 0; display: inline-block; background: var(--ok-bg); border-radius: 16px; padding: 8px 16px; font-weight: 900; font-size: 20px; }
.fb-ans.ar { font-family: var(--arab); font-size: 28px; line-height: 1.7; }
.fb-ans i.swc { display: inline-block; width: 26px; height: 26px; border-radius: 8px; vertical-align: middle; margin-right: 6px; border: 1px solid rgba(0,0,0,.15); }
.btn { display: block; width: 100%; border-radius: 20px; padding: 15px; font-family: var(--display); font-weight: 800; font-size: 21px; margin-top: 16px; }
.btn.primary { background: var(--ink); color: #fff; box-shadow: 0 5px 0 #0d1238; }
.btn.sun { background: var(--sun); color: var(--ink); box-shadow: 0 5px 0 #C98A00; }
.btn.ghost { background: var(--card); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn:active { transform: translateY(3px); box-shadow: none; }
.fb.list { max-height: 80vh; overflow: auto; text-align: left; }

/* result */
.result { padding: calc(30px + env(safe-area-inset-top)) 20px 20px; text-align: center; }
.trophy { font-size: 110px; line-height: 1; animation: pop .6s cubic-bezier(.3,1.6,.5,1) both; }
.result h1 { font-size: 34px; margin-top: 10px; }
.stars { font-size: 44px; letter-spacing: 6px; margin-top: 8px; color: #D2D7E8; }
.stars b { color: var(--sun); font-weight: 400; }
.rstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.rstat { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px; }
.rstat b { display: block; font-family: var(--display); font-size: 32px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rstat span { font-weight: 800; color: var(--ink-2); font-size: 13.5px; }

/* parent */
.pin { padding: calc(30px + env(safe-area-inset-top)) 24px; text-align: center; }
.pin h1 { font-size: 28px; }
.pin p { color: var(--ink-2); font-weight: 700; margin: 6px 0 0; }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 22px 0; }
.pin-dots i { width: 18px; height: 18px; border-radius: 50%; background: #D5DBEE; }
.pin-dots i.f { background: var(--ink); }
.pin-dots.err i { background: var(--coral); animation: shake .35s; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 300px; margin: 0 auto; }
.keypad button { height: 64px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 0 var(--line); font-family: var(--display); font-weight: 800; font-size: 26px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin: 0 16px 14px; }
.panel h2 { font-size: 19px; margin-bottom: 4px; }
.panel .hint { color: var(--ink-2); font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.row:first-of-type { border-top: 0; }
.row .grow { flex: 1; min-width: 120px; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { font-weight: 800; font-size: 14px; }
input[type="text"], input[type="password"], input[type="email"], select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
}
textarea { min-height: 80px; resize: vertical; }
textarea.ar, input.ar { font-family: var(--arab); font-size: 22px; line-height: 1.7; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 800; }
.switch:first-of-type { border-top: 0; }
.switch input { width: 22px; height: 22px; accent-color: var(--ink); }
.sbtn { border-radius: 12px; padding: 9px 14px; font-weight: 900; background: var(--ink); color: #fff; font-size: 14px; }
.sbtn.light { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.sbtn.danger { background: var(--no-bg); color: #B4271A; }
.seg { display: flex; gap: 6px; }
.seg button { padding: 8px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-weight: 900; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable th, .ptable td { text-align: left; padding: 7px 4px; border-top: 1px solid var(--line); }
.ptable th { font-size: 12.5px; color: var(--ink-2); }
.ptable td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
.tag { font-size: 11.5px; font-weight: 900; padding: 2px 8px; border-radius: 99px; background: #FFF1CC; color: #7A5300; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 800; z-index: 30; animation: up .2s ease-out; }
.empty { text-align: center; color: var(--ink-2); font-weight: 700; padding: 30px 16px; }
.plist { display: grid; gap: 8px; margin-top: 12px; }
.plist button { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--bg); font-weight: 900; font-size: 18px; }
.plist button[aria-current="true"] { background: var(--ink); color: #fff; }

@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 480px) { .mod { min-height: 168px; } }

/* ---------- v2 additions ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-b { flex: none; padding: 9px 14px; border-radius: 99px; background: var(--card); border: 1.5px solid var(--line); font-weight: 900; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.chip-b[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.learn-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.learn-h h3 { font-size: 19px; }
.fc-btn { flex: none; border-radius: 14px; padding: 9px 13px; font-weight: 900; font-size: 14px; background: var(--sun); color: var(--ink); box-shadow: 0 3px 0 #C98A00; }
.count-note { color: var(--ink-2); font-weight: 800; font-size: 13px; margin-top: 2px; }
.node .topic { font-size: 12.5px; font-weight: 800; color: var(--ink-2); margin-top: -2px; text-align: center; line-height: 1.2; max-width: 128px; }
.syl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

.syl .head { background: var(--ink); color: #fff; }
.tip { background: var(--bg); border-radius: 16px; padding: 12px 14px; margin-top: 10px; font-weight: 700; color: #343B6E; }
.tip b { color: var(--ink); }
.calc { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.25; font-variant-numeric: tabular-nums; text-align: right; display: inline-block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; margin-top: 8px; }
.calc hr { border: 0; border-top: 2px solid var(--ink); margin: 2px 0; }
.qlist { display: grid; gap: 10px; padding: 16px; }
.qitem { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px 14px; text-align: left; width: 100%; }
.qnum { width: 44px; height: 44px; flex: none; border-radius: 14px; background: var(--q, #9C2A4A); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
.qitem .grow { flex: 1; min-width: 0; }
.qitem b { font-family: var(--display); font-size: 18px; display: block; line-height: 1.15; }
.qitem small { color: var(--ink-2); font-weight: 700; }
.qitem .ar { font-size: 24px; flex: none; }
.qitem.off { opacity: .45; }
.qsec { font-weight: 900; color: var(--ink-2); font-size: 13px; letter-spacing: .4px; text-transform: uppercase; margin: 6px 4px 0; }
.mushaf { font-family: var(--arab); direction: rtl; text-align: justify; text-align-last: center; font-size: 27px; line-height: 2.15; margin-top: 10px; }
.mushaf .an { font-size: 22px; color: #9C2A4A; margin: 0 2px; }
.mushaf-note { margin-top: 10px; background: #FFF1CC; color: #6B4A00; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 13.5px; }
.fc-wrap { perspective: 1200px; margin-top: 12px; }
.fc { position: relative; height: 270px; transition: transform .45s ease; transform-style: preserve-3d; cursor: pointer; }
.fc.flip { transform: rotateY(180deg); }
.fc > div { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; display: grid; place-items: center; text-align: center; padding: 18px; }
.fc .front { background: var(--ink); color: #fff; }
.fc .back { background: var(--sun); color: var(--ink); transform: rotateY(180deg); }
.fc .big-ar { font-family: var(--arab); font-size: 46px; line-height: 1.6; direction: rtl; }
.fc .big-em { font-size: 80px; line-height: 1.1; }
.fc .big-tx { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.15; }
.fc .sm { font-weight: 800; opacity: .8; margin-top: 6px; font-size: 16px; }
.fc-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 14px; }
.fc-nav .btn { margin: 0; padding: 12px; font-size: 18px; }
.fc-count { font-weight: 900; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fc-hint { text-align: center; font-weight: 800; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.story { text-align: left; font-size: 17px; line-height: 1.6; background: var(--bg); border-radius: 16px; padding: 12px 14px; margin-top: 8px; font-weight: 600; }
.story b { display: block; font-family: var(--display); font-size: 18px; margin-bottom: 4px; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 4px; }
.frac i { font-style: normal; }
.frac i:first-child { border-bottom: 3px solid currentColor; padding: 0 4px 2px; }
.frac i:last-child { padding-top: 2px; }
.parent-q { margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; font-weight: 800; color: var(--ink-2); }
.parent-q select { width: auto; flex: 1; min-width: 180px; padding: 8px 10px; }

/* ---------- v3: audio, perpustakaan, polesan ---------- */
.big-play { display: inline-flex; align-items: center; gap: 10px; margin: 10px auto 4px; padding: 10px 20px 10px 10px; border-radius: 99px; background: #9C2A4A; color: #fff; font-family: var(--display); font-weight: 800; font-size: 19px; box-shadow: 0 5px 0 #6E1530; }
.big-play .pi { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: #9C2A4A; display: grid; place-items: center; font-size: 20px; padding-left: 3px; }
.big-play.playing .pi, .opt-play.playing { animation: pulse 1s ease-in-out infinite; }
.big-play.playing .pi::before { content: ''; }
.big-play.wide { display: flex; width: 100%; justify-content: center; margin-top: 14px; }
.opt-row { display: flex; gap: 10px; align-items: stretch; }
.opt-row .opt { flex: 1; }
.opt-play { flex: none; width: 58px; border-radius: 18px; background: #9C2A4A; color: #fff; font-size: 22px; box-shadow: 0 4px 0 #6E1530; padding-left: 3px; }
.opt-play.off { background: transparent; box-shadow: none; }
.opt-play.playing { background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 #C98A00; }
.play-hint { text-align: center; color: var(--ink-2); font-weight: 800; font-size: 13.5px; margin: 0; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.fb-ar { font-family: var(--arab); font-size: 40px; line-height: 1.5; color: var(--ink); margin-top: 4px; direction: rtl; }
.fb.ok .fb-ar + .fb-t { margin-top: 0; font-size: 24px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 3px; animation: fall 1.6s cubic-bezier(.25,.6,.4,1) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: .9; } }
.qcard { background: linear-gradient(180deg, #FFFFFF 0%, #FBFCFF 100%); }
.qcard::before { content: ''; position: absolute; left: 24px; right: 24px; top: -1px; height: 5px; border-radius: 0 0 6px 6px; background: var(--sun); }
.mod-body { position: relative; z-index: 1; min-width: 0; }
.mod .bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.28); margin-top: 8px; overflow: hidden; }
.mod.dark .bar { background: rgba(27,33,84,.15); }
.mod .bar i { display: block; height: 100%; background: #fff; border-radius: 99px; }
.mod.dark .bar i { background: var(--ink); }
.mod.lib { color: var(--ink); border: 1.5px solid var(--line); min-height: 96px; }
.mod.lib .glyph { background: var(--bg); font-size: 28px; }
.mod.lib::after { display: none; }
.tgt { display: inline-block; font-family: var(--body); font-size: 11px; font-weight: 900; color: #6B4A00; background: #FFE6A3; border-radius: 99px; padding: 1px 8px; vertical-align: middle; }
.mushaf .ayah.can { cursor: pointer; text-decoration: underline dotted rgba(156,42,74,.45); text-underline-offset: 10px; border-radius: 10px; }
.mushaf .ayah.playing { background: #FFE6A3; text-decoration: none; }
.book-card { display: flex; gap: 14px; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--bk); border-radius: 22px; padding: 14px; }
.book-cover { width: 74px; height: 104px; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 12px rgba(27,33,84,.18); flex: none; background: var(--bg); }
.book-cover.land { width: 110px; height: 62px; }
.book-card .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.book-card b { font-family: var(--display); font-size: 19px; line-height: 1.15; }
.book-card small { color: var(--ink-2); font-weight: 700; }
.bk-k { font-size: 11.5px; font-weight: 900; color: var(--ink-2); text-transform: uppercase; letter-spacing: .4px; }
.book-open { justify-self: start; margin-top: 6px; border-radius: 12px; padding: 8px 14px; font-weight: 900; background: var(--ink); color: #fff; }
.book-link { margin-top: 10px; border-radius: 12px; padding: 8px 12px; font-weight: 900; background: var(--sun); color: var(--ink); }
.toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin-top: 10px; }
.toc button { display: flex; justify-content: space-between; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--bg); font-weight: 800; font-size: 14px; text-align: left; }

.band.slim { padding-bottom: 14px; }
.chips.sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 10px; }
.pages { display: grid; gap: 12px; padding: 4px 12px 20px; }
.pages figure { margin: 0; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 10px rgba(27,33,84,.12); scroll-margin-top: 64px; }
.pages img { display: block; width: 100%; height: auto; }
.pages figcaption { text-align: center; font-weight: 800; color: var(--ink-2); font-size: 12px; padding: 4px; background: var(--bg); }

/* ---------- v4 ---------- */
.home-foot { padding: 22px 16px 8px; text-align: center; }
.home-foot button { color: var(--ink-2); font-weight: 700; font-size: 14px; line-height: 1.4; }
.home-foot b { color: var(--ink); }
.home-foot span { font-size: 12.5px; }
.about-hero { background: var(--ink); color: #fff; border-radius: 26px; padding: 22px 18px; text-align: center; position: relative; overflow: hidden; }
.about-hero::after { content: ''; position: absolute; width: 160px; height: 160px; border-radius: 50%; background: var(--sun); right: -60px; top: -70px; opacity: .9; }

.ab-logo { width: 96px; height: 96px; margin: 0 auto 10px; border-radius: 28px; background: #fff; color: var(--ink); display: grid; place-items: center; align-content: center; line-height: 1.1; box-shadow: 0 6px 0 rgba(0,0,0,.25); }

.maker { text-align: center; border: 2px solid var(--sun); }
.mk-k { font-size: 12px; font-weight: 900; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); }

.lib-h { margin: 10px 2px 2px; font-family: var(--display); font-size: 18px; color: var(--c); display: flex; align-items: center; gap: 8px; }

/* v6 kenalan & layar penuh */
.setup-top { padding-bottom: 26px; }
.setup-h { font-family: var(--display); font-size: 28px; line-height: 1.15; margin: 18px 0 6px; }
.setup-p { opacity: .8; font-weight: 600; margin: 0; }
.setup { padding: 18px 16px 40px; display: grid; gap: 16px; max-width: 560px; margin: 0 auto; }

.plist .padd { justify-content: center; font-weight: 900; color: #2B7BEF; border: 2px dashed #B9CCF0; background: transparent; }
.brand-name { flex-wrap: wrap; row-gap: 0; white-space: nowrap; min-width: 0; }

.praise-note .ar { font-size: 17px; color: var(--ink); }

/* v8 tombol kembali yang jelas */
.band-row { flex-direction: column; align-items: flex-start; gap: 10px; }
button.back { width: auto; height: 44px; padding: 0 18px 0 12px; border-radius: 99px; background: #fff; color: var(--ink); font-family: var(--body); font-size: 17px; font-weight: 900; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.18); }
button.back b { font-size: 26px; line-height: 1; margin-top: -3px; }

.x.quit { width: auto; padding: 0 14px 0 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; height: 42px; border-radius: 99px; border: 2px solid var(--line); }
.x.quit b { font-size: 16px; }
.jk-grid button { font-size: 19px; padding: 18px 8px; }
.pin button.back { background: var(--card); border: 2px solid var(--line); box-shadow: none; }

/* v9 panduan pasang */
.inst-hero { display: flex; align-items: center; gap: 14px; }
.inst-hero img { border-radius: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }

<body>
<div id="app"></div>
<div id="sheet" aria-live="polite"></div>
<script src="cloud-config.js"></script>
<script src="data.js"></script>
<script src="data-bank.js"></script>
<script src="data-nahwu.js"></script>
<script src="data-quran.js"></script>

<script src="data-saku.js"></script>
<script>
/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
const app = $('#app'), sheet = $('#sheet');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const ri = (a, b) => a + rnd(b - a + 1);
const pick = a => a[rnd(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (a, n) => shuffle(a).slice(0, n);
const chance = p => Math.random() < p;
const cleanAr = t => t.replace(/[،؟.]/g, '');
const fmt = n => Number(n).toLocaleString('id-ID');
const arDigits = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const mark = s => s.replace('[', '<mark>').replace(']', '</mark>');
const unmark = s => s.replace(/[\[\]]/g, '');
function uniqBy(a, f) { const seen = new Set(); return a.filter(x => { const k = f(x); if (seen.has(k)) return false; seen.add(k); return true; }); }

/* ================= MERGED DATA ================= */
const ALL_COLORS = [...COLORS, ...COLORS2];
const COLOR = Object.fromEntries(ALL_COLORS.map(c => [c.id, c]));
const ALL_WORDS = uniqBy([...WORDS, ...WORDS2.map(w => [w[0], w[1]])], w => w[0]);
const ALL_KALIMAT = [...KALIMAT, ...KALIMAT2];
const ALL_DOA = [...DOA, ...DOA2];
const ALL_MUF = uniqBy(MUF, w => w[0] + w[1]);
const ALL_JAMAK = uniqBy([...JAMAK, ...JAMAK2], j => j[0]);
const ALL_LAWAN = uniqBy([...LAWAN, ...LAWAN2], p => p[0]);
const ALL_MUH = [...MUHADATSAH.map(m => [m[0], m[1], m[2], 'Umum']), ...MUHADATSAH2];
const ALL_OBJ = [...COLOR_OBJ, ...COLOR_OBJ2];
const ALL_MIX = [...COLOR_MIX, ...COLOR_MIX2];
const SURAH_BY = Object.fromEntries(SURAH.map(s => [s[0], { no: s[0], latin: s[1], ar: s[2], arti: s[3], ayat: s[4], juz: s[5] }]));

/* ================= STATE ================= */
const KEY = 'kebun-ilmu-v1';
// Usia → level awal yang disarankan (TK/kelas 1 = 1, kelas 2 = 2, kelas 3–4 = 3, kelas 5 = 4, kelas 6 = 5)
function levelFromAge(u) { u = +u || 0; return u <= 7 ? 1 : u === 8 ? 2 : u <= 10 ? 3 : u === 11 ? 4 : 5; }
const isGirl = p => (p && p.jk) === 'P';
function freshProfile(name, usia, jk) { return { id: 'p' + Date.now().toString(36) + rnd(999), name, usia: usia || 0, jk: jk || 'L', level: usia ? levelFromAge(usia) : 1, cups: 0, prog: {}, stats: {}, hafal: {}, quranUntil: 0, doaHafal: {} }; }
function defaults() {
  const p = freshProfile('Ananda');
  return { profiles: [p], cur: p.id, pin: '1234', count: 5, lockLevel: false, sound: true, hidden: {}, hafalan: HAFALAN_DEFAULT.map(h => ({ ...h })), custom: [] };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.profiles && s.profiles.length ? s : null; } catch (e) { return null; } }
const FIRST_RUN = !load();
let S = load() || defaults();
function save(sync) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} if (sync !== false && window.__cloudSchedule) window.__cloudSchedule(); }
const P = () => S.profiles.find(p => p.id === S.cur) || S.profiles[0];

/* ================= SOUND & VOICE ================= */
let actx;
function tone(freq, t0, dur, vol, type) {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + t0;
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .05);
}
function blip(ok) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    if (ok) { // "cling": dua denting lonceng kecil
      [[1568, 0, .5], [3136, 0, .25], [2093, .11, .75], [4186, .11, .3]].forEach(([f, t, d], i) => tone(f, t, d, i % 2 ? .05 : .16));
    } else { tone(220, 0, .25, .14, 'triangle'); tone(185, .12, .3, .1, 'triangle'); }
  } catch (e) {}
}

/* ---------- Pemutar murottal (satu elemen audio untuk semua potongan) ---------- */
const AUD = new Audio(); AUD.preload = 'auto';
let audEnd = 0, audTok = 0, audBtn = null;
function stopClip() { audTok++; try { AUD.pause(); } catch (e) {} if (audBtn) audBtn.classList.remove('playing'); audBtn = null; }
function playClip(c, btn) {
  if (!c) return; stopClip(); const tok = audTok; audEnd = c.b; audBtn = btn || null; if (audBtn) audBtn.classList.add('playing');
  const go = () => { if (tok !== audTok) return; try { AUD.currentTime = c.a; } catch (e) {} AUD.play().catch(() => {}); watch(); };
  const watch = () => { if (tok !== audTok) return; if (AUD.currentTime >= audEnd - .02 || AUD.ended) { stopClip(); return; } requestAnimationFrame(watch); };
  const full = new URL(c.f, location.href).href;
  if (AUD.src === full && AUD.readyState >= 1) go(); else { AUD.src = c.f; AUD.addEventListener('loadedmetadata', go, { once: true }); AUD.load(); }
}
const ayClip = (s, i) => { const q = QAUDIO[s]; const x = q && q.a[i]; return x && x[2] ? { f: q.f, a: x[0], b: x[1] } : null; };
const openClip = s => { const q = QAUDIO[s]; return q ? { f: q.f, a: q.open[0], b: q.open[1] } : null; };
const surahClip = s => { const q = QAUDIO[s]; return q ? { f: q.f, a: 0, b: q.d } : null; };
const canSpeak = 'speechSynthesis' in window;
function arVoice() { try { return speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang)); } catch (e) { return null; } }
function sayPraise(t) {
  if (!S.sound || !canSpeak) return;
  try { const v = arVoice(); if (!v) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.voice = v; u.lang = v.lang; u.rate = .9; u.pitch = 1.1; setTimeout(() => speechSynthesis.speak(u), 380); } catch (e) {}
}
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
function speak(text, lang) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang || 'id-ID'; u.rate = .85; speechSynthesis.speak(u); } catch (e) {} }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }

/* ================= QUESTION BUILDERS ================= */
function mc(o) {
  const n = o.n || 4;
  const wrong = shuffle([...new Set(o.pool.filter(x => x !== o.answer))]).slice(0, n - 1);
  const opts = shuffle([o.answer, ...wrong]);
  return { ...o, type: 'mc', opts, ans: opts.indexOf(o.answer) };
}
const tf = (o, v) => ({ ...o, type: 'tf', ans: v });
function nearNums(ans, opt = {}) {
  const s = new Set([ans]); const a = Math.abs(ans);
  const steps = a < 10 ? [1, 2, 3] : a < 100 ? [1, 2, 10, 5, 11] : a < 1000 ? [1, 10, 100, 2, 20, 11] : a < 100000 ? [1, 10, 100, 1000, 9, 110] : [10, 100, 1000, 10000, 1, 1100];
  let t = 0;
  while (s.size < 4 && t++ < 100) { const v = ans + (chance(.5) ? 1 : -1) * pick(steps) * (t > 40 ? ri(1, 3) : 1); if (opt.neg || v >= 0) s.add(v); }
  return [...s];
}
function numMc(o, ans, opt = {}) {
  const f = opt.f || fmt;
  const vals = opt.vals || nearNums(ans, opt);
  return mc({ ...o, kind: 'big', answer: f(ans), pool: vals.map(f) });
}
const LETTERS = 'ABCDEFGHIJKLMNOPRSTUWY'.split('');
function fillQ(word, blanks, extra, o) {
  const need = blanks.map(i => word[i]);
  const dis = sample(LETTERS.filter(c => !need.includes(c)), extra);
  return { ...o, type: 'fill', word, blanks, pool: shuffle([...need, ...dis]) };
}
function blanksFor(word, k) { return sample([...word].map((_, i) => i), Math.min(k, word.length - 1)).sort((a, b) => a - b); }
function misspell(w) {
  const a = [...w]; const i = ri(1, a.length - 2);
  if (chance(.5) && a[i] !== a[i + 1]) { [a[i], a[i + 1]] = [a[i + 1], a[i]]; }
  else { const V = 'AIUEO'; a[i] = V.includes(a[i]) ? pick([...V].filter(v => v !== a[i])) : pick(LETTERS.filter(c => c !== a[i] && !V.includes(c))); }
  const r = a.join(''); return r === w ? w.slice(0, -1) + (w.endsWith('A') ? 'O' : 'A') : r;
}
const isVowel = c => 'AIUEO'.includes(c);
function firstSyl(w) { return !isVowel(w[0]) && isVowel(w[1]) && !isVowel(w[2] || 'X') ? w.slice(0, 2) : (!isVowel(w[0]) && isVowel(w[1]) ? w.slice(0, 2) : null); }

/* ---------- Membaca ---------- */
const Wlen = (a, b) => ALL_WORDS.filter(w => w[0].length >= a && w[0].length <= b);
const Tlen = (a, b) => TEBAKAN.filter(w => w[0].length >= a && w[0].length <= b);
function sylQ(L) {
  const cands = Wlen(4, 6).filter(w => firstSyl(w[0])); const w = pick(cands); const s = firstSyl(w[0]);
  const pool = VOKAL.map(v => s[0] + v);
  return mc({ key: 'sy' + w[0], label: 'Suku kata depannya apa?', emoji: w[1], speak: w[0].toLowerCase(), kind: 'letter', answer: s, pool, n: 3 });
}
function genBaca(L) {
  const r = Math.random();
  if (L === 1) {
    if (r < .4) { const w = pick(Wlen(3, 5)); return fillQ(w[0], [0], 2, { key: 'a' + w[0], label: 'Huruf pertamanya apa?', emoji: w[1], speak: w[0].toLowerCase() }); }
    if (r < .65) { const c = pick('ABDEGIKLMNOPRSTU'.split('')); return mc({ key: 'h' + c, label: 'Huruf kecil ini, huruf besarnya yang mana?', big: c.toLowerCase(), speak: 'huruf ' + c.toLowerCase(), kind: 'letter', n: 3, answer: c, pool: LETTERS }); }
    return sylQ(L);
  }
  if (L === 2) {
    if (r < .45) { const w = pick(Wlen(4, 6)); return fillQ(w[0], blanksFor(w[0], 1), 3, { key: w[0], label: 'Lengkapi hurufnya!', emoji: w[1], speak: w[0].toLowerCase() }); }
    if (r < .7) { const w = pick(Wlen(4, 7)); return mc({ key: 't' + w[0], label: 'Mana tulisan yang benar?', emoji: w[1], kind: 'big', answer: w[0], pool: [misspell(w[0]), misspell(w[0]), misspell(w[0])], n: 3 }); }
    return sylQ(L);
  }
  if (L === 3) {
    if (r < .45) { const w = pick(Wlen(4, 6)); return fillQ(w[0], blanksFor(w[0], 2), 3, { key: w[0], label: 'Isi kotak yang kosong!', emoji: w[1], speak: w[0].toLowerCase() }); }
    if (r < .7) { const w = pick(Tlen(3, 6)); return fillQ(w[0], blanksFor(w[0], 2), 3, { key: 'q' + w[0], label: 'Teka-teki kata', qtext: w[1] }); }
    const k = pick(ALL_KALIMAT); return mc({ key: 'k' + k[0], label: 'Kata apa yang cocok?', html: `<div class="qtext">${esc(k[0]).replace('___', '<span class="blank">?</span>')}</div>`, answer: k[1], pool: k[2] });
  }
  if (L === 4) {
    if (r < .3) { const w = pick(Wlen(4, 7)); return fillQ(w[0], [...w[0]].map((_, i) => i), 0, { key: 's' + w[0], label: 'Susun hurufnya jadi kata!', emoji: w[1] }); }
    if (r < .5) { const w = pick(Wlen(6, 9)); return fillQ(w[0], blanksFor(w[0], 3), 3, { key: w[0], label: 'Isi tiga kotak yang kosong!', emoji: w[1] }); }
    if (r < .75) { const w = pick(Tlen(4, 7)); return fillQ(w[0], blanksFor(w[0], Math.ceil(w[0].length / 2)), 3, { key: 'q' + w[0], label: 'Teka-teki kata', qtext: w[1] }); }
    const k = pick(ALL_KALIMAT); return mc({ key: 'k' + k[0], label: 'Kata apa yang cocok?', html: `<div class="qtext">${esc(k[0]).replace('___', '<span class="blank">?</span>')}</div>`, answer: k[1], pool: k[2] });
  }
  if (r < .35) { const b = pick(BACAAN), s = pick(b.soal); return mc({ key: 'b' + s[0], label: 'Baca ceritanya, lalu jawab', html: `<div class="story"><b>${esc(b.judul)}</b>${esc(b.teks)}</div><div class="qtext" style="font-size:20px;margin-top:10px">${esc(s[0])}</div>`, answer: s[1], pool: s[2] }); }
  if (r < .5) { const k = pick(ALL_KALIMAT); return mc({ key: 'k' + k[0], label: 'Kata apa yang cocok?', html: `<div class="qtext">${esc(k[0]).replace('___', '<span class="blank">?</span>')}</div>`, answer: k[1], pool: k[2] }); }
  if (r < .65) { const w = pick(Wlen(6, 10)); const right = chance(.5); const shown = right ? w[0] : misspell(w[0]); return tf({ key: 'e' + w[0], label: 'Tulisan ini sudah benar?', emoji: w[1], big: shown, reveal: w[0] }, shown === w[0]); }
  if (r < .82) { const w = pick(Tlen(5, 8)); return fillQ(w[0], [...w[0]].map((_, i) => i), 0, { key: 's' + w[0], label: 'Susun huruf sesuai petunjuk', qtext: w[1] }); }
  const w = pick(Wlen(7, 10)); return fillQ(w[0], blanksFor(w[0], 4), 2, { key: w[0], label: 'Lengkapi kata yang panjang ini!', emoji: w[1] });
}

/* ---------- Matematika: 4 operasi tiap level ---------- */
const OBJ = ['🍎', '⭐', '🎈', '🍓', '🌸', '🍪', '🍊', '⚽', '🍌', '🧁'];
const MTK_TOPICS = ['Tambah', 'Kurang', 'Kali', 'Bagi', 'Campuran'];
const fracHtml = (a, b) => `<span class="frac"><i>${a}</i><i>${b}</i></span>`;
function mtkOp(L, op) {
  const big = (label, expr, ans, o = {}) => numMc({ key: expr, label, big: expr + ' = ?', ...o.q }, ans, o);
  if (L === 1) {

    const kode = (v.kode || '').trim();
    if (Cloud.in()) {
      const btn = $('#setupF button[type=submit]'); btn.disabled = true; btn.textContent = 'Menyimpan…';
      (async () => {
        try { await Cloud.createKid(p); if (kode) { const k = await Cloud.gabung(p, kode); toast(nama + ' masuk ' + k.nama); } else toast('Ahlan wa sahlan, ' + nama + '!'); go({ name: 'home' }); }

}

function band(m) {
  const L = P().level;
  let extra = '';
  if (m.id === 'quran') { const pool = quranPool(); const last = SURAH_BY[pool[pool.length - 1]]; extra = `<span class="chip" style="margin-left:6px">Hafalan: ${pool.length} surat, sampai ${last.latin}</span>`; }
  if (m.id === 'nahwu' && L >= 3) extra = `<span class="chip" style="margin-left:6px">${L === 3 ? 'Materi kelas 4' : L === 4 ? 'Materi kelas 5' : 'Materi kelas 6'}</span>`;
  return `<header class="band ${m.dark ? 'dark' : ''}" style="--c:${m.c}">
    <div class="band-row"><button class="back" id="back"><b aria-hidden="true">‹</b> Kembali</button>
      <div><h1>${m.title}</h1><div class="ar">${m.ar}</div></div></div>

function renderMod() {
  const m = MOD[view.mod], p = P(), L = p.level;
  const prog = p.prog[m.id + L] || [], topics = topicsOf(m, L);
  let body = '';
  if (view.tab === 'main') {
    if (m.id === 'hafalan' && !S.hafalan.length) body = `<div class="empty">Belum ada hafalan. Minta ayah atau ibu menambahkannya di ⚙️ Kontrol Orang Tua.</div>`;
    else body = `<div class="path">${topics.map((tp, i) => {
      const st = prog[i] || 0, open = m.free || i === 0 || (prog[i - 1] || 0) > 0;
      const cls = !open ? 'lock' : st ? 'done' : '';
      return `<div class="node-row"><button class="node ${cls}" data-t="${i}" ${open ? '' : 'disabled'} aria-label="Tantangan ${i + 1}">
        <span class="disc" style="--c:${m.c};--cd:${m.cd}">${open ? i + 1 : '🔒'}</span>
        <span class="lbl">${m.free ? (m.id === 'abn' ? 'Bab ' + (i + 1) : 'Tempat ' + (i + 1)) : 'Tantangan ' + (i + 1)}</span>${tp ? `<span class="topic">${esc(m.free ? tp.replace(/^Bab \d+ · /, '') : tp)}</span>` : ''}
        <span class="st">${'<b>★</b>'.repeat(st)}${'★'.repeat(3 - st)}</span></button></div>`;
    }).join('')}</div>`;
  } else body = learnHtml(m, L);
  app.innerHTML = band(m) + `<div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="learn" aria-selected="${view.tab === 'learn'}">📖 Belajar</button>
      <button class="tab" role="tab" data-tab="main" aria-selected="${view.tab === 'main'}">🎮 Main</button>
    </div>${body}`;
  $('#back').onclick = () => go({ name: 'home' });
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { view.tab = b.dataset.tab; view.sub = null; render(); });
  app.querySelectorAll('.node:not(.lock)').forEach(b => b.onclick = () => startGame(m.id, +b.dataset.t));
  bindLearn(m, L);
}

  return Array.from({ length: n }, (_, k) => {
    const first = k * c + 1, cnt = Math.min(c, b.pages - k * c);
    const marks = Array.from({ length: cnt }, (_, j) => `<span class="pg-mark" id="pg-${first + j}" style="top:${(j * 100 / cnt).toFixed(4)}%"><i>${first + j}</i></span>`).join('');
    return `<figure class="strip"><img src="${b.dir}p${k + 1}.webp" width="${b.w}" height="${b.h * cnt}" loading="lazy" alt="Halaman ${first}–${first + cnt - 1}">${marks}</figure>`;
  }).join('');
}

let G = null;
function buildSession(modId, L, t, n) {
  const m = MOD[modId], qs = [], keys = new Set();
  const custom = shuffle(S.custom.filter(c => c.mod === modId && (+c.level === 0 || +c.level === L)));
  let ci = 0, tries = 0;
  while (qs.length < n && tries++ < n * 15) {
    if (custom.length && ci < custom.length && chance(.4)) {
      const c = custom[ci++];
      qs.push(mc({ key: 'c' + c.id, label: 'Soal dari ayah/ibu', qtext: c.q, answer: c.a, pool: c.wrong, n: c.wrong.length + 1, safe: true }));
      continue;
    }
    let q; try { q = m.gen(L, t); } catch (e) { console.warn(e); q = null; }
    if (!q) { if (tries > n * 3) break; continue; }
    if (keys.has(q.key) && tries < n * 10) continue;
    keys.add(q.key); qs.push(q);
  }
  return qs;
}
function startGame(modId, t) {
  const L = P().level, qs = buildSession(modId, L, t, S.count);

}

function drawFill(q) {

  $('#pool').querySelectorAll('.tile').forEach(b => b.onclick = () => {
    G.fill.push(+b.dataset.p);

      $('#pool').querySelectorAll('.tile').forEach(t => t.disabled = true); $('#undo').style.visibility = 'hidden';

}

/* =====================================================================
   AKUN & KELAS ONLINE (Supabase, lewat fetch tanpa library)
   - Orang tua: daftar/masuk dengan email, progres anak tersimpan online
   - Wali kelas: memantau murid di kelasnya
   - Pemilik: semua kelas, undang wali kelas, unduh rekap
   Kalau cloud-config.js kosong, semua fitur ini tersembunyi.
   ===================================================================== */
const CFG = (window.CLOUD && window.CLOUD.url && window.CLOUD.key) ? { url: window.CLOUD.url.replace(/\/+$/, ''), key: window.CLOUD.key } : null;
const JENJANG = ['TK', 'Kelas 1', 'Kelas 2', 'Kelas 3', 'Kelas 4', 'Kelas 5', 'Kelas 6'];
const ERR_ID = [
  [/invalid login credentials/i, 'Email atau kata sandi salah.'],
  [/already registered|already been registered|user already exists/i, 'Email ini sudah terdaftar. Silakan masuk.'],
  [/password should be at least|at least 6/i, 'Kata sandi minimal 6 karakter.'],
  [/unable to validate email|invalid email|email address .* is invalid/i, 'Alamat email tidak valid.'],
  [/email not confirmed/i, 'Email belum dikonfirmasi. Cek kotak masuk email Anda.'],
  [/rate limit|too many/i, 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.'],
  [/jwt expired|invalid jwt|not authorized/i, 'Sesi berakhir. Silakan masuk lagi.'],
  [/failed to fetch|networkerror|load failed|network/i, 'Tidak ada koneksi internet.'],
];
const errText = e => { const m = (e && (e.message || e.msg || e.error_description || e.error)) || String(e); const f = ERR_ID.find(r => r[0].test(m)); return f ? f[1] : m; };

const Cloud = {
  on: () => !!CFG,
  in: () => !!(CFG && S.akun && S.akun.at),
  staff: () => Cloud.in() && ['guru', 'pemilik'].includes(S.akun.peran),
  owner: () => Cloud.in() && S.akun.peran === 'pemilik',
  busy: false, status: '', timer: null,

  async http(method, path, body, opt = {}) {
    if (!CFG) throw new Error('Akun online belum disiapkan');
    const h = { apikey: CFG.key, 'Content-Type': 'application/json' };
    if (!opt.noAuth) {
      await Cloud.fresh();
      if (S.akun && S.akun.at) h.Authorization = 'Bearer ' + S.akun.at;
    }
    if (opt.prefer) h.Prefer = opt.prefer;
    const r = await fetch(CFG.url + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
    const txt = await r.text(); let js = null; try { js = txt ? JSON.parse(txt) : null; } catch (e) {}
    if (!r.ok) {
      if (r.status === 401 && !opt.noAuth && !opt.retried && S.akun && S.akun.rt) { S.akun.exp = 0; return Cloud.http(method, path, body, { ...opt, retried: true }); }
      throw new Error((js && (js.message || js.msg || js.error_description || js.error)) || ('HTTP ' + r.status));
    }
    return js;
  },
  async fresh() {
    const a = S.akun; if (!a || !a.rt) return;
    if (a.exp && a.exp - 60 > Date.now() / 1000) return;
    const js = await Cloud.http('POST', '/auth/v1/token?grant_type=refresh_token', { refresh_token: a.rt }, { noAuth: true }).catch(e => { if (/invalid|not found|revoked|expired/i.test(e.message)) { S.akun = null; save(); } throw e; });
    Cloud.setSess(js);
  },
  setSess(js) {
    S.akun = Object.assign(S.akun || {}, { at: js.access_token, rt: js.refresh_token, exp: Math.floor(Date.now() / 1000) + (js.expires_in || 3600), uid: js.user.id, email: js.user.email });
    save(false);
  },
  async daftar(nama, email, pass, asal) {
    const js = await Cloud.http('POST', '/auth/v1/signup', { email, password: pass, data: { nama, asal: asal || 'umum' } }, { noAuth: true });
    if (!js || !js.access_token) throw new Error('Pendaftaran berhasil. Buka email Anda untuk konfirmasi, lalu masuk.');
    Cloud.setSess(js); S.akun.asal = asal || 'umum'; await Cloud.afterLogin();
  },
  async masuk(email, pass) {
    const js = await Cloud.http('POST', '/auth/v1/token?grant_type=password', { email, password: pass }, { noAuth: true });
    Cloud.setSess(js); await Cloud.afterLogin();
  },
  async lupa(email) {
    await Cloud.http('POST', '/auth/v1/recover', { email, redirect_to: location.origin + location.pathname }, { noAuth: true });
  },
  async gantiSandi(pass) { await Cloud.http('PUT', '/auth/v1/user', { password: pass }); },
  async keluar() {
    try { await Cloud.http('POST', '/auth/v1/logout', {}); } catch (e) {}
    S.akun = null; S.profiles.forEach(p => { delete p.cid; delete p.kelas; delete p._h; }); S.antre = []; save(false);
  },
  async afterLogin() {
    const rows = await Cloud.http('GET', '/rest/v1/profil?select=*&id=eq.' + S.akun.uid);
    const me = rows && rows[0];
    if (me) Object.assign(S.akun, { nama: me.nama, peran: me.peran, email: me.email, asal: me.asal || S.akun.asal || 'umum' });
    if (['guru', 'pemilik'].includes(S.akun.peran)) S.akun.asal = 'pondok';
    save(false);
    await Cloud.pull();
  },

  /* ---------- data anak milik orang tua ---------- */
  pack: p => ({ level: p.level, cups: p.cups, prog: p.prog, stats: p.stats, hafal: p.hafal, quranUntil: p.quranUntil, doaHafal: p.doaHafal }),
  hash: s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; },
  isPlaceholder: p => p.name === 'Ananda' && !p.usia && !p.cups && !Object.keys(p.prog || {}).length,
  async pull() {
    if (!Cloud.in()) return;
    const rows = await Cloud.http('GET', '/rest/v1/anak?select=id,nama,usia,jk,kelas_id,data,diperbarui&ortu_id=eq.' + S.akun.uid + '&order=dibuat.asc');
    const kids = rows || [];
    const kelasIds = [...new Set(kids.map(r => r.kelas_id).filter(Boolean))];
    let kelas = {};
    if (kelasIds.length) { (await Cloud.http('GET', '/rest/v1/kelas?select=id,nama,jenjang&id=in.(' + kelasIds.join(',') + ')') || []).forEach(k => { kelas[k.id] = k; }); }
    if (kids.length) S.profiles = S.profiles.filter(p => p.cid || !Cloud.isPlaceholder(p));
    kids.forEach(r => {
      let p = S.profiles.find(x => x.cid === r.id);
      const d = r.data || {};
      if (!p) { p = freshProfile(r.nama, r.usia, r.jk); p.cid = r.id; S.profiles.push(p); p._h = null; }
      const local = JSON.stringify(Cloud.pack(p));
      const unchangedLocally = p._h === Cloud.hash(local);
      if (!p._h || unchangedLocally) { // ambil versi server bila HP ini tidak punya perubahan baru
        p.name = r.nama; p.usia = r.usia; p.jk = r.jk || p.jk;
        ['level', 'cups', 'prog', 'stats', 'hafal', 'quranUntil', 'doaHafal'].forEach(k => { if (d[k] !== undefined) p[k] = d[k]; });
        p._h = Cloud.hash(JSON.stringify(Cloud.pack(p)));
      }
      p.kelas = r.kelas_id ? (kelas[r.kelas_id] || { id: r.kelas_id, nama: 'Kelas' }) : null;
    });
    if (!S.profiles.length) S.profiles = [freshProfile('Ananda')];
    if (!S.profiles.find(p => p.id === S.cur)) S.cur = S.profiles[0].id;
    save(false);
    await Cloud.flush();
  },
  async createKid(p) {
    const rows = await Cloud.http('POST', '/rest/v1/anak', { ortu_id: S.akun.uid, nama: p.name, usia: p.usia || null, jk: p.jk || null, data: Cloud.pack(p) }, { prefer: 'return=representation' });
    p.cid = rows[0].id; p._h = Cloud.hash(JSON.stringify(Cloud.pack(p))); save(false);
  },
  async flush() {
    if (!Cloud.in() || !navigator.onLine) return;
    if (Cloud.busy) { Cloud.pending = true; return; }
    Cloud.busy = true;
    try {
      for (const p of S.profiles) {
        if (!p.cid) { if (Cloud.isPlaceholder(p)) continue; await Cloud.createKid(p); continue; }
        const h = Cloud.hash(JSON.stringify(Cloud.pack(p)) + '|' + p.name + '|' + p.usia + '|' + p.jk);
        if (p._hx === h) continue;
        await Cloud.http('PATCH', '/rest/v1/anak?id=eq.' + p.cid, { nama: p.name, usia: p.usia || null, jk: p.jk || null, data: Cloud.pack(p), diperbarui: new Date().toISOString() }, { prefer: 'return=minimal' });
        p._hx = h; p._h = Cloud.hash(JSON.stringify(Cloud.pack(p)));
      }
      const q = (S.antre || []).map(x => ({ ...x, anak_id: (S.profiles.find(p => p.id === x.pid) || {}).cid })).filter(x => x.anak_id);
      if (q.length) {
        await Cloud.http('POST', '/rest/v1/hasil', q.map(({ pid, k, ...r }) => r), { prefer: 'return=minimal' });
        const sent = new Set(q.map(x => x.k)); S.antre = (S.antre || []).filter(x => !sent.has(x.k));
      }
      Cloud.status = 'ok';
    } catch (e) { Cloud.status = errText(e); }
    finally { Cloud.busy = false; save(false); if (Cloud.pending) { Cloud.pending = false; setTimeout(() => Cloud.flush(), 300); } }
  },
  schedule() { if (!Cloud.in()) return; clearTimeout(Cloud.timer); Cloud.timer = setTimeout(() => Cloud.flush(), 1500); },
  logResult(p, r) {
    if (!Cloud.in()) return;
    S.antre = S.antre || [];
    S.antre.push({ k: Date.now() + '-' + Math.random().toString(36).slice(2, 6), pid: p.id, ...r, waktu: new Date().toISOString() });
    if (S.antre.length > 500) S.antre = S.antre.slice(-500);
    save(false); Cloud.flush();
  },
  async gabung(p, kode) {
    if (!p.cid) await Cloud.createKid(p);
    const js = await Cloud.http('POST', '/rest/v1/rpc/gabung_kelas', { p_kode: kode, p_anak: p.cid });
    p.kelas = js && js.kelas_id ? { id: js.kelas_id, nama: js.nama, jenjang: js.jenjang } : null; save(false);
    return p.kelas;
  },
  rpc: (fn, args) => Cloud.http('POST', '/rest/v1/rpc/' + fn, args || {}),
  async setAsal(asal) { S.akun.asal = asal; save(false); try { await Cloud.http('PATCH', '/rest/v1/profil?id=eq.' + S.akun.uid, { asal }, { prefer: 'return=minimal' }); } catch (e) {} },
};
window.addEventListener('online', () => Cloud.flush());

(function cekTautanEmail() {
  if (!CFG || !location.hash || location.hash.indexOf('access_token=') < 0) return;
  const q = new URLSearchParams(location.hash.slice(1));
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (!q.get('access_token')) return;
  S.akun = { at: q.get('access_token'), rt: q.get('refresh_token'), exp: Math.floor(Date.now() / 1000) + (+q.get('expires_in') || 3600) };
  try { const pl = JSON.parse(atob(q.get('access_token').split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); S.akun.uid = pl.sub; S.akun.email = pl.email; } catch (e) {}
  save(false);
  if (q.get('type') === 'recovery') view = { name: 'akun', mode: 'baru', from: { name: 'home' } };
  Cloud.afterLogin().then(() => render()).catch(() => {});
})();

/* ---------- Pantau kelas (wali kelas & pemilik) ---------- */
const fmtWaktu = t => {
  if (!t) return 'belum pernah';
  const d = new Date(t), now = new Date(), mnt = Math.round((now - d) / 60000);
  if (mnt < 2) return 'baru saja'; if (mnt < 60) return mnt + ' menit lalu';
  const j = Math.round(mnt / 60); if (j < 24 && d.getDate() === now.getDate()) return j + ' jam lalu';
  const hari = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  return hari === 1 ? 'kemarin' : hari < 7 ? hari + ' hari lalu' : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
};
const bintangDari = d => Object.values((d && d.prog) || {}).reduce((a, arr) => a + (arr || []).reduce((x, y) => x + (y || 0), 0), 0);
const quranSampai = d => { const pool = quranPool({ quranUntil: d && d.quranUntil }); const s = SURAH_BY[pool[pool.length - 1]]; return s ? s.latin : '-'; };

        <span class="m-n"><b>${r.latihan_hari_ini}</b><small>hari ini</small></span><span class="m-n"><b>${r.latihan_7hari}</b><small>${pct === null ? '7 hari' : pct + '% benar'}</small></span></button>`; }).join('')
      : '<div class="empty">Tidak ada murid di daftar ini. Murid masuk kelas setelah orang tua memasukkan kode kelas.</div>'}`;
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { view.filter = b.dataset.f; renderKelasku(); });
  app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => detailMurid(rows.find(r => r.anak_id === b.dataset.a)));
}

async function detailMurid(r) {
  const d = r.data || {};
  const modRows = MODS.map(m => { const st = LEVELS.reduce((a, l) => a + ((d.prog || {})[m.id + l.n] || []).reduce((x, y) => x + (y || 0), 0), 0); const s = (d.stats || {})[m.id] || { b: 0, s: 0 }; return { m, st, s }; }).filter(x => x.st || x.s.b || x.s.s);
  const doaN = Object.values(d.doaHafal || {}).filter(Boolean).length;
  openSheet(`<div class="fb list ok" style="text-align:left"><div class="fb-t" style="color:var(--ink)">${esc(r.nama)}</div>
    <div class="hint" style="margin:0 0 10px">${r.usia ? r.usia + ' tahun · ' : ''}${r.jk === 'P' ? 'Perempuan' : r.jk === 'L' ? 'Laki-laki' : ''} · Level ${d.level || 1} · terakhir ${fmtWaktu(r.terakhir)}</div>
    <div class="stat-row"><div class="stat"><b>${bintangDari(d)}</b><span>bintang</span></div><div class="stat"><b>${d.cups || 0}</b><span>piala</span></div><div class="stat"><b>${r.latihan_7hari}</b><span>latihan 7 hari</span></div></div>
    <div class="hint" style="margin:6px 0">📖 Hafalan Al-Qur'an sampai <b>${esc(quranSampai(d))}</b> · 🤲 ${doaN} doa/dzikir ditandai hafal</div>
    <table class="ptable"><thead><tr><th>Modul</th><th style="text-align:right">⭐</th><th style="text-align:right">Benar</th><th style="text-align:right">Salah</th></tr></thead><tbody>
    ${modRows.length ? modRows.map(x => `<tr><td>${x.m.title}</td><td class="n">${x.st}</td><td class="n">${x.s.b}</td><td class="n">${x.s.s}</td></tr>`).join('') : '<tr><td colspan="4">Belum ada latihan.</td></tr>'}</tbody></table>
    <h3 style="margin:14px 0 6px;font-size:16px">Latihan terakhir</h3><div id="riwayat" class="hint">Memuat…</div>
    <button class="btn primary" id="closeS">Tutup</button></div>`);
  $('#closeS').onclick = closeSheet;
  try {
    const h = await Cloud.http('GET', '/rest/v1/hasil?select=modul,level,tantangan,benar,jumlah,bintang,waktu&anak_id=eq.' + r.anak_id + '&order=waktu.desc&limit=12');
    const el = $('#riwayat'); if (!el) return;
    el.innerHTML = h && h.length ? h.map(x => `<div class="riw"><span>${esc((MOD[x.modul] || { title: x.modul }).title)} · Lv ${x.level || '-'}${x.tantangan ? ' · ' + esc(x.tantangan) : ''}</span><span>${x.benar}/${x.jumlah} ${'★'.repeat(x.bintang || 0)} · ${fmtWaktu(x.waktu)}</span></div>`).join('') : 'Belum ada latihan tercatat.';
  } catch (e) { const el = $('#riwayat'); if (el) el.textContent = errText(e); }
}

function unduhRekap(kelasRows) {
  Cloud.rpc('rekap_murid', { p_kelas: null }).then(rows => {
    const kn = Object.fromEntries((kelasRows || []).map(k => [k.kelas_id, k.nama]));
    const head = ['Kelas', 'Nama', 'Usia', 'Jenis kelamin', 'Level', 'Bintang', 'Piala', 'Latihan hari ini', 'Latihan 7 hari', 'Benar 7 hari', 'Soal 7 hari', 'Hafalan Quran sampai', 'Terakhir aktif'];
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [head.map(q).join(';')].concat(rows.map(r => { const d = r.data || {}; return [kn[r.kelas_id] || '', r.nama, r.usia || '', r.jk === 'P' ? 'P' : r.jk === 'L' ? 'L' : '', d.level || 1, bintangDari(d), d.cups || 0, r.latihan_hari_ini, r.latihan_7hari, r.benar_7hari, r.soal_7hari, quranSampai(d), r.terakhir ? new Date(r.terakhir).toLocaleString('id-ID') : ''].map(q).join(';'); }));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rekap-kebun-ilmu-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Rekap diunduh');
  }).catch(e => toast(errText(e)));
}

/* ---------- Kelola (khusus pemilik) ---------- */
async function renderKelola() {
  if (!Cloud.owner()) { go({ name: 'home' }); return; }
  app.innerHTML = pantauShell('Kelola', 'الْإِدَارَةُ', '<div class="empty">Memuat…</div>');
  $('#back').onclick = () => go({ name: 'pantau' });
  let kelas, guru, gk, undangan;
  try {
    [kelas, guru, gk, undangan] = await Promise.all([
      Cloud.http('GET', '/rest/v1/kelas?select=id,nama,jenjang,kode&order=jenjang.asc,nama.asc'),
      Cloud.http('GET', '/rest/v1/profil?select=id,email,nama,peran&peran=in.(guru,pemilik)&order=nama.asc'),
      Cloud.http('GET', '/rest/v1/guru_kelas?select=guru_id,kelas_id'),
      Cloud.http('GET', '/rest/v1/undangan_guru?select=email,nama,kelas_id&order=dibuat.desc')]);
  } catch (e) { app.querySelector('.learn').innerHTML = `<div class="empty">${esc(errText(e))}</div>`; return; }
  if (view.name !== 'kelola') return;
  const kn = Object.fromEntries(kelas.map(k => [k.id, k.nama]));
  const kelasCheck = (sel = []) => kelas.map(k => `<label class="dh-item" style="padding:6px 0"><input type="checkbox" name="gk" value="${k.id}" ${sel.includes(k.id) ? 'checked' : ''}><span><b>${esc(k.nama)}</b></span></label>`).join('') || '<p class="hint">Buat kelas dulu.</p>';
  app.querySelector('.learn').innerHTML = `
  <section class="panel" style="margin:0"><h2>Kelas</h2>
    ${kelas.map(k => `<div class="row"><div class="grow"><b>${esc(k.nama)}</b><div class="hint" style="margin:0">${JENJANG[k.jenjang]} · kode <span class="kode">${esc(k.kode)}</span></div></div><button class="sbtn light" data-copy="${esc(k.kode)}">Salin kode</button><button class="sbtn danger" data-delk="${k.id}">Hapus</button></div>`).join('') || '<p class="hint">Belum ada kelas.</p>'}
    <form id="kForm" class="row" style="border:0;gap:8px;flex-wrap:wrap"><input type="text" id="kNama" placeholder="Nama kelas, mis. Kelas 1A" required style="flex:2;min-width:160px">
      <select id="kJen" style="flex:1">${JENJANG.map((j, i) => `<option value="${i}" ${i === 1 ? 'selected' : ''}>${j}</option>`).join('')}</select><button class="sbtn" type="submit">+ Buat kelas</button></form>
  </section>
  <section class="panel" style="margin:0"><h2>Wali kelas</h2>
    ${guru.filter(g => g.peran === 'guru').map(g => { const ks = gk.filter(x => x.guru_id === g.id).map(x => kn[x.kelas_id]).filter(Boolean); return `<div class="row"><div class="grow"><b>${esc(g.nama || g.email)}</b><div class="hint" style="margin:0">${esc(g.email)} · ${ks.length ? esc(ks.join(', ')) : 'belum ada kelas'}</div></div><button class="sbtn light" data-editg="${esc(g.email)}">Ubah</button><button class="sbtn danger" data-cabut="${esc(g.email)}">Cabut</button></div>`; }).join('')}
    ${undangan.map(u => `<div class="row"><div class="grow"><b>${esc(u.nama || u.email)}</b> <span class="tag">menunggu daftar</span><div class="hint" style="margin:0">${esc(u.email)} · ${esc((u.kelas_id || []).map(id => kn[id]).filter(Boolean).join(', ') || 'belum ada kelas')}</div></div><button class="sbtn danger" data-cabut="${esc(u.email)}">Batal</button></div>`).join('')}
    ${!guru.some(g => g.peran === 'guru') && !undangan.length ? '<p class="hint">Belum ada wali kelas.</p>' : ''}
    <form id="gForm" style="margin-top:12px"><h3 style="font-size:16px;margin:0 0 8px">Undang wali kelas</h3>
      <div class="field"><label for="gNama">Nama</label><input type="text" id="gNama" placeholder="mis. Ustadz Abdullah" required></div>
      <div class="field"><label for="gEmail">Email</label><input type="email" id="gEmail" placeholder="email wali kelas" required></div>
      <div class="field"><label>Kelas yang dipegang</label><div id="gKelas">${kelasCheck()}</div></div>
      <p class="hint">Setelah diundang, wali kelas cukup membuka Kebun Ilmu dan <b>mendaftar dengan email ini</b>. Kalau sudah punya akun, kelasnya langsung aktif.</p>
      <button class="sbtn" type="submit">Simpan undangan</button></form>
  </section>`;
  app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { try { navigator.clipboard.writeText(b.dataset.copy).then(() => toast('Kode ' + b.dataset.copy + ' disalin'), () => toast('Kode: ' + b.dataset.copy)); } catch (e) { toast('Kode: ' + b.dataset.copy); } });
  app.querySelectorAll('[data-delk]').forEach(b => b.onclick = async () => {
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Yakin? Murid keluar dari kelas'; return; }
    try { await Cloud.http('DELETE', '/rest/v1/kelas?id=eq.' + b.dataset.delk, undefined, { prefer: 'return=minimal' }); toast('Kelas dihapus'); renderKelola(); } catch (e) { toast(errText(e)); }
  });
  $('#kForm').onsubmit = async e => { e.preventDefault(); try { await Cloud.http('POST', '/rest/v1/kelas', { nama: $('#kNama').value.trim(), jenjang: +$('#kJen').value }, { prefer: 'return=minimal' }); toast('Kelas dibuat'); renderKelola(); } catch (err) { toast(errText(err)); } };
  app.querySelectorAll('[data-cabut]').forEach(b => b.onclick = async () => {
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = 'Yakin?'; return; }
    try { await Cloud.rpc('cabut_guru', { p_email: b.dataset.cabut }); toast('Dicabut'); renderKelola(); } catch (e) { toast(errText(e)); }
  });
  app.querySelectorAll('[data-editg]').forEach(b => b.onclick = () => {
    const g = guru.find(x => x.email === b.dataset.editg); $('#gNama').value = g.nama || ''; $('#gEmail').value = g.email;
    const sel = gk.filter(x => x.guru_id === g.id).map(x => x.kelas_id); $('#gKelas').innerHTML = kelasCheck(sel);
    $('#gForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('#gForm').onsubmit = async e => {
    e.preventDefault();
    const ids = [...app.querySelectorAll('#gKelas input[name=gk]:checked')].map(c => c.value);
    try { const r = await Cloud.rpc('undang_guru', { p_email: $('#gEmail').value.trim(), p_nama: $('#gNama').value.trim(), p_kelas: ids }); toast(r === 'aktif' ? 'Wali kelas aktif' : 'Undangan disimpan'); renderKelola(); } catch (err) { toast(errText(err)); }
  };
}

/* Mulai: perbarui data bila sudah masuk */
if (Cloud.in()) Cloud.afterLogin().then(() => { if (view.name === 'home' && Cloud.staff() && S.profiles.every(Cloud.isPlaceholder)) go({ name: 'pantau' }); else if (['home', 'parent'].includes(view.name)) render(); }).catch(() => {});
window.__cloudSchedule = () => Cloud.schedule();


render();

</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }</script>
